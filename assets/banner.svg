<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Accent Gradient 1 -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Accent Gradient 2 -->
    <linearGradient id="magentaPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Dynamic Background Grid / Decent Identity Graph Nodes -->
  <g opacity="0.25">
    <!-- Connecting Mesh Lines -->
    <path d="M 100 80 L 250 160 L 180 260 L 400 220 L 550 280 L 700 220 L 850 270 L 1050 190 L 950 80 L 750 120 L 550 50 L 350 100 Z" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-dasharray="8 4">
      <animate attributeName="stroke-dashoffset" from="0" to="48" dur="12s" repeatCount="indefinite" />
    </path>
    <path d="M 250 160 L 550 50 L 700 220 L 950 80" stroke="#06b6d4" stroke-width="1" fill="none" />
    <path d="M 180 260 L 550 280 L 1050 190" stroke="#ec4899" stroke-width="1" fill="none" />

    <!-- Pulsing Nodes -->
    <circle cx="100" cy="80" r="6" fill="#06b6d4" filter="url(#glow)">
      <animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="160" r="8" fill="#8b5cf6" filter="url(#glow)">
      <animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="260" r="5" fill="#ec4899" />
    <circle cx="550" cy="50" r="7" fill="#3b82f6" filter="url(#glow)" />
    <circle cx="550" cy="280" r="9" fill="#8b5cf6" filter="url(#glow)">
      <animate attributeName="r" values="7;11;7" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="80" r="6" fill="#06b6d4" />
    <circle cx="1050" cy="190" r="8" fill="#ec4899" filter="url(#glow)">
      <animate attributeName="r" values="6;10;6" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Verifiable Credential Badge Elements (Background side Accents) -->
  <g opacity="0.15" transform="translate(920, 40)">
    <!-- Shield / ID Card Outline -->
    <rect x="0" y="0" width="180" height="220" rx="16" fill="none" stroke="url(#cyanPurple)" stroke-width="3"/>
    <line x1="25" y1="40" x2="115" y2="40" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="70" x2="155" y2="70" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="100" x2="135" y2="100" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="130" cy="160" r="25" fill="none" stroke="url(#magentaPink)" stroke-width="3"/>
    <path d="M 120 160 L 127 167 L 142 150" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Title and Subtitle Header Group -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 50)">
      <rect x="-140" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="0" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">
        SECURITY • PRIVACY • STANDARDS
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Decentralized Identity
    </text>
    
    <!-- Title Highlight Line -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="url(#cyanPurple)">
      &amp; Verifiable Credentials
    </text>

    <!-- Subtitle -->
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated List of SaaS Platforms, Self-Sovereign Identity (SSI) Infrastructure &amp; W3C VC Protocols
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
        <tspan fill="#38bdf8">W3C VC</tspan> • <tspan fill="#a855f7">DID Methods</tspan> • <tspan fill="#f43f5e">SD-JWT</tspan> • <tspan fill="#34d399">OID4VC</tspan> • <tspan fill="#fbbf24">Zero-Knowledge Proofs</tspan>
      </text>
    </g>
  </g>
</svg>
